<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1200" width="1100" height="1200" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrAmberR1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <linearGradient id="headerGradR2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadowR2" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1.5" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrR2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrGreenR2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrRedR2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="15" width="1040" height="60" rx="8" fill="url(#headerGradR2)"/>
  <text x="50" y="42" fill="#ffffff" font-size="18" font-weight="bold">Figure R2: Selective Decision Operational Flowchart (Component A)</text>
  <text x="50" y="62" fill="#fde68a" font-size="12">Standard Flowchart Representation of Mask-Conditioned Uncertainty Triage and Degeneracy Fallback</text>

  <!-- Node 1: Start (Oval) -->
  <g transform="translate(550, 115)" filter="url(#shadowR2)">
    <rect x="-170" y="-22" width="340" height="44" rx="22" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <text x="0" y="5" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Start: Ingest Predicted Mask Ŷ and Uncertainty ℋ</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="550" y1="137" x2="550" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#arrR2)"/>

  <!-- Node 2: Input (Parallelogram) -->
  <g transform="translate(550, 200)" filter="url(#shadowR2)">
    <polygon points="-190,-25 170,-25 190,25 -170,25" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
    <text x="0" y="-4" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">Inputs: Binary Mask Ŷ ∈ {0, 1}²⁵⁶ˣ²⁵⁶, Uncertainty Map ℋ ∈ ℝ²⁵⁶ˣ²⁵⁶,</text>
    <text x="0" y="14" fill="#334155" font-size="11" text-anchor="middle">Frozen Thresholds: τ* = 0.064058324, τ_neg = 0.0001</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="550" y1="225" x2="550" y2="260" stroke="#334155" stroke-width="2" marker-end="url(#arrR2)"/>

  <!-- Node 3: Decision 1 - Integrity Validation (Diamond) -->
  <g transform="translate(550, 310)" filter="url(#shadowR2)">
    <polygon points="0,-45 150,0 0,45 -150,0" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
    <text x="0" y="-12" fill="#78350f" font-size="11" font-weight="bold" text-anchor="middle">Input Integrity Check</text>
    <text x="0" y="4" fill="#92400e" font-size="10" text-anchor="middle">Are Array Shapes 256² &amp; Finite?</text>
    <text x="0" y="18" fill="#b45309" font-size="9" text-anchor="middle">(No NaN, Inf, or Dimension Mismatch)</text>
  </g>

  <!-- Branch D1 No: Invalid Data -->
  <line x1="700" y1="310" x2="840" y2="310" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRedR2)"/>
  <text x="740" y="300" fill="#dc2626" font-size="10" font-weight="bold">No: Corrupted</text>

  <!-- Terminal: Error -->
  <g transform="translate(940, 310)" filter="url(#shadowR2)">
    <rect x="-90" y="-22" width="180" height="44" rx="22" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="0" y="-2" fill="#991b1b" font-size="10" font-weight="bold" text-anchor="middle">Emit Exception / Error</text>
    <text x="0" y="14" fill="#b91c1c" font-size="9" text-anchor="middle">Halt / Reject Prediction</text>
  </g>

  <!-- Branch D1 Yes: Valid -->
  <line x1="550" y1="355" x2="550" y2="395" stroke="#16a34a" stroke-width="2" marker-end="url(#arrGreenR2)"/>
  <text x="560" y="380" fill="#16a34a" font-size="10" font-weight="bold">Yes</text>

  <!-- Node 4: Process - Evaluate Foreground Area -->
  <g transform="translate(550, 425)" filter="url(#shadowR2)">
    <rect x="-160" y="-22" width="320" height="44" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="0" y="-3" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">Evaluate Predicted Foreground Pixel Count</text>
    <text x="0" y="14" fill="#475569" font-size="10" text-anchor="middle">Define Stencil: count_fg = |Ω_fg| = ∑_{(x,y)} I(Ŷ(x,y) &gt; 0)</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="550" y1="447" x2="550" y2="480" stroke="#334155" stroke-width="2" marker-end="url(#arrR2)"/>

  <!-- Node 5: Decision 2 - Foreground Presence Check (Diamond) -->
  <g transform="translate(550, 535)" filter="url(#shadowR2)">
    <polygon points="0,-50 160,0 0,50 -160,0" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="0" y="-15" fill="#78350f" font-size="11" font-weight="bold" text-anchor="middle">Foreground Lesion Check</text>
    <text x="0" y="3" fill="#92400e" font-size="11" font-weight="bold" text-anchor="middle">Is count_fg &gt; 0 ?</text>
    <text x="0" y="20" fill="#b45309" font-size="9" text-anchor="middle">(Did Model Predict Any Lesion Pixels?)</text>
  </g>

  <!-- ================= LEFT: BRANCH A (LESION PRESENT) ================= -->
  <line x1="390" y1="535" x2="280" y2="535" stroke="#16a34a" stroke-width="2"/>
  <line x1="280" y1="535" x2="280" y2="595" stroke="#16a34a" stroke-width="2" marker-end="url(#arrGreenR2)"/>
  <text x="310" y="525" fill="#16a34a" font-size="10" font-weight="bold">Yes: Lesion Present</text>

  <!-- Process A1: Apply Stencil & Compute U_fg -->
  <g transform="translate(280, 630)" filter="url(#shadowR2)">
    <rect x="-140" y="-30" width="280" height="60" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.8"/>
    <text x="0" y="-12" fill="#15803d" font-size="11" font-weight="bold" text-anchor="middle">Apply Spatial Stencil Operator</text>
    <text x="0" y="5" fill="#166534" font-size="10" text-anchor="middle">Extract Entropy Values Inside Ω_fg</text>
    <text x="0" y="21" fill="#14532d" font-size="10" font-weight="bold" text-anchor="middle">Compute U_fg = (1/|Ω_fg|) ∑_{Ω_fg} ℋ</text>
  </g>

  <!-- Arrow A1 -> Decision A -->
  <line x1="280" y1="660" x2="280" y2="700" stroke="#334155" stroke-width="2" marker-end="url(#arrR2)"/>

  <!-- Decision A: Threshold Comparison (Diamond) -->
  <g transform="translate(280, 755)" filter="url(#shadowR2)">
    <polygon points="0,-45 130,0 0,45 -130,0" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="0" y="-12" fill="#78350f" font-size="11" font-weight="bold" text-anchor="middle">Uncertainty Evaluation</text>
    <text x="0" y="4" fill="#92400e" font-size="11" font-weight="bold" text-anchor="middle">Is U_fg ≤ τ* ?</text>
    <text x="0" y="18" fill="#ca8a04" font-size="9" text-anchor="middle">(τ* = 0.064058324)</text>
  </g>

  <!-- Branch A: Yes -> ACCEPTED -->
  <line x1="280" y1="800" x2="280" y2="855" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrGreenR2)"/>
  <text x="290" y="830" fill="#16a34a" font-size="10" font-weight="bold">Yes: Confident</text>

  <!-- Terminal A1: ACCEPTED -->
  <g transform="translate(280, 895)" filter="url(#shadowR2)">
    <polygon points="-130,-25 110,-25 130,25 -110,25" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="0" y="-5" fill="#15803d" font-size="11" font-weight="bold" text-anchor="middle">Decision: ACCEPTED</text>
    <text x="0" y="11" fill="#166534" font-size="9" text-anchor="middle">Status: High-Confidence Focal Mass</text>
  </g>

  <!-- Branch A: No -> REVIEW_REQUIRED -->
  <line x1="150" y1="755" x2="90" y2="755" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="90" y1="755" x2="90" y2="950" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrRedR2)"/>
  <text x="100" y="745" fill="#dc2626" font-size="10" font-weight="bold">No: Ambiguous</text>

  <!-- Terminal A2: REVIEW_REQUIRED -->
  <g transform="translate(90, 990)" filter="url(#shadowR2)">
    <polygon points="-80,-25 60,-25 80,25 -60,25" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="0" y="-5" fill="#991b1b" font-size="10" font-weight="bold" text-anchor="middle">REVIEW REQUIRED</text>
    <text x="0" y="11" fill="#b91c1c" font-size="8" text-anchor="middle">Borderline / High Dissonance</text>
  </g>

  <!-- ================= RIGHT: BRANCH B (EMPTY MASK FALLBACK) ================= -->
  <line x1="710" y1="535" x2="820" y2="535" stroke="#b45309" stroke-width="2"/>
  <line x1="820" y1="535" x2="820" y2="595" stroke="#b45309" stroke-width="2" marker-end="url(#arrAmberR1)"/>
  <text x="725" y="525" fill="#b45309" font-size="10" font-weight="bold">No: Empty Mask (0/0)</text>

  <!-- Process B1: Fallback to U_mean -->
  <g transform="translate(820, 630)" filter="url(#shadowR2)">
    <rect x="-140" y="-30" width="280" height="60" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.8"/>
    <text x="0" y="-12" fill="#92400e" font-size="11" font-weight="bold" text-anchor="middle">Trigger Degeneracy Fallback</text>
    <text x="0" y="5" fill="#78350f" font-size="10" text-anchor="middle">Prevent Division by Zero (0/0)</text>
    <text x="0" y="21" fill="#b45309" font-size="10" font-weight="bold" text-anchor="middle">Compute U_mean = (1/|Ω|) ∑_{Ω} ℋ</text>
  </g>

  <!-- Arrow B1 -> Decision B -->
  <line x1="820" y1="660" x2="820" y2="700" stroke="#334155" stroke-width="2" marker-end="url(#arrR2)"/>

  <!-- Decision B: Negative Field Check (Diamond) -->
  <g transform="translate(820, 755)" filter="url(#shadowR2)">
    <polygon points="0,-45 130,0 0,45 -130,0" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="0" y="-12" fill="#78350f" font-size="11" font-weight="bold" text-anchor="middle">Negative Screening Check</text>
    <text x="0" y="4" fill="#92400e" font-size="11" font-weight="bold" text-anchor="middle">Is U_mean ≤ τ_neg ?</text>
    <text x="0" y="18" fill="#ca8a04" font-size="9" text-anchor="middle">(τ_neg = 0.0001)</text>
  </g>

  <!-- Branch B: Yes -> ACCEPTED_NEGATIVE -->
  <line x1="820" y1="800" x2="820" y2="855" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrGreenR2)"/>
  <text x="830" y="830" fill="#16a34a" font-size="10" font-weight="bold">Yes: Quiescent Field</text>

  <!-- Terminal B1: ACCEPTED_NEGATIVE -->
  <g transform="translate(820, 895)" filter="url(#shadowR2)">
    <polygon points="-130,-25 110,-25 130,25 -110,25" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="0" y="-5" fill="#15803d" font-size="11" font-weight="bold" text-anchor="middle">ACCEPTED_NEGATIVE</text>
    <text x="0" y="11" fill="#166534" font-size="9" text-anchor="middle">Status: Confident Normal Breast Scan</text>
  </g>

  <!-- Branch B: No -> REVIEW_REQUIRED_EMPTY -->
  <line x1="950" y1="755" x2="1010" y2="755" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="1010" y1="755" x2="1010" y2="950" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrRedR2)"/>
  <text x="960" y="745" fill="#dc2626" font-size="10" font-weight="bold">No: Active Field</text>

  <!-- Terminal B2: REVIEW_REQUIRED_EMPTY -->
  <g transform="translate(1010, 990)" filter="url(#shadowR2)">
    <polygon points="-80,-25 60,-25 80,25 -60,25" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="0" y="-5" fill="#991b1b" font-size="10" font-weight="bold" text-anchor="middle">REVIEW REQUIRED</text>
    <text x="0" y="11" fill="#b91c1c" font-size="8" text-anchor="middle">Possible Missed Lesion</text>
  </g>

  <!-- Convergence to Package Telemetry -->
  <path d="M 280 920 L 280 1060 L 530 1060" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M 90 1015 L 90 1060 L 530 1060" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M 820 920 L 820 1060 L 570 1060" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M 1010 1015 L 1010 1060 L 570 1060" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Final Process: Package Metadata -->
  <g transform="translate(550, 1060)" filter="url(#shadowR2)">
    <rect x="-180" y="-22" width="360" height="44" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="0" y="-3" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">Package Decision Reason &amp; Telemetry Metadata</text>
    <text x="0" y="14" fill="#475569" font-size="9" text-anchor="middle">Serialize metric_used, score, threshold, coverage_target, and audit logs</text>
  </g>

  <!-- Arrow to End -->
  <line x1="550" y1="1082" x2="550" y2="1120" stroke="#334155" stroke-width="2" marker-end="url(#arrR2)"/>

  <!-- Terminal: End (Oval) -->
  <g transform="translate(550, 1145)" filter="url(#shadowR2)">
    <rect x="-150" y="-20" width="300" height="40" rx="20" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <text x="0" y="5" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">End: Return Decision Tuple &amp; Overlay</text>
  </g>
</svg>